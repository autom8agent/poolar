<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Shag vs Terry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@500;600;700&display=swap">
<style>
  :root{
    color-scheme:dark;
    --bg:#0c1411; --felt:#123026; --felt-hi:#18402f; --panel:#15201b; --line:#26372f;
    --text:#eef4ef; --muted:#8ea69a; --chalk:#5aa9ff; --gold:#f2c14e; --warn:#e4685a;
    --num:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
    --ui:"Barlow",system-ui,-apple-system,Roboto,sans-serif;
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--ui);margin:0;overflow:hidden;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .race{font-family:var(--num);font-weight:900;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
  .race small{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin-left:6px}
  .rackno{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
  .players{flex:1;display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
  .p{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--panel);
    display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;padding:14px 18px;
    cursor:pointer;touch-action:manipulation;overflow:hidden;transition:background .15s,border-color .15s;min-height:0}
  .p:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
  .p.breaking{background:radial-gradient(120% 100% at 80% 20%,var(--felt-hi),var(--felt));border-color:#2f5a45}
  .p.flash{animation:flash .35s ease-out}
  @keyframes flash{from{box-shadow:inset 0 0 0 999px var(--chalk)}to{box-shadow:inset 0 0 0 999px transparent}}
  .name{font-size:clamp(20px,6vw,30px);font-weight:700;line-height:1.1;align-self:start;text-wrap:balance}
  .need{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
  .score{grid-column:2;grid-row:1 / span 3;align-self:center;font-family:var(--num);font-weight:900;
    font-size:clamp(96px,30vw,190px);line-height:.85;font-variant-numeric:tabular-nums}
  .badge{grid-column:1;grid-row:2;align-self:center;justify-self:start;background:var(--gold);color:#1d1606;
    font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
  .pips{grid-column:1;grid-row:3;display:flex;flex-wrap:wrap;gap:7px}
  .pip{width:18px;height:18px;border-radius:50%;border:2px solid #3b5448}
  .pip.on{background:var(--text);border-color:var(--text);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
  .hint{font-size:12px;color:var(--muted);text-align:center}
  .bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{font-family:var(--ui);font-weight:700;font-size:14px;color:var(--text);background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:12px 6px;cursor:pointer;touch-action:manipulation}
  button:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
  button:active{background:var(--felt)}
  button:disabled{opacity:.4}
  button.primary{background:var(--chalk);border-color:var(--chalk);color:#04162b}
  button.danger{border-color:#6a2c26;color:#ffb3aa}
  .sheet{position:fixed;inset:0;background:rgba(4,8,6,.78);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px}
  .card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;
    display:flex;flex-direction:column;gap:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .card h2{margin:0;font-family:var(--num);font-weight:900;font-size:28px;letter-spacing:.04em;text-transform:uppercase}
  .card p{margin:0;color:var(--muted)}
  label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  input,select{font:600 17px var(--ui);color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .log{font-size:13px;color:var(--muted);max-height:30vh;overflow:auto;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
  .log div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-block:4px}
  .win h2{color:var(--gold);font-size:40px}
  @media (prefers-reduced-motion:reduce){.p{transition:none}.p.flash{animation:none}}
</style>

<div class="app">
  <header>
    <div class="race" id="raceLbl">Race 5–5<small>8-ball</small></div>
    <div class="rackno" id="rackNo">Rack 1</div>
  </header>

  <div class="players">
    <div class="p" id="p0" role="button" tabindex="0" aria-label="Add rack">
      <div><div class="name" id="n0"></div><div class="need" id="d0"></div></div>
      <div class="score" id="s0">0</div>
      <div class="badge" id="b0">Breaks</div>
      <div class="pips" id="k0"></div>
    </div>
    <div class="p" id="p1" role="button" tabindex="0" aria-label="Add rack">
      <div><div class="name" id="n1"></div><div class="need" id="d1"></div></div>
      <div class="score" id="s1">0</div>
      <div class="badge" id="b1">Breaks</div>
      <div class="pips" id="k1"></div>
    </div>
  </div>

  <div class="hint">Tap a player when they win the rack</div>
  <div class="bar">
    <button id="undo">Undo</button>
    <button id="swap">Swap break</button>
    <button id="logBtn">Racks</button>
    <button id="setBtn">Setup</button>
  </div>
</div>

<div class="sheet" id="setup" hidden>
  <form class="card" id="setupForm">
    <h2>Match setup</h2>
    <div class="two">
      <label>Player 1<input id="fn0" autocomplete="off"></label>
      <label>Race to<input id="fr0" type="number" min="1" max="99" inputmode="numeric"></label>
      <label>Player 2<input id="fn1" autocomplete="off"></label>
      <label>Race to<input id="fr1" type="number" min="1" max="99" inputmode="numeric"></label>
    </div>
    <div class="two">
      <label>First break<select id="fb"><option value="0">Player 1</option><option value="1">Player 2</option></select></label>
      <label>Break after<select id="fm"><option value="alt">Alternate</option><option value="win">Winner breaks</option><option value="lose">Loser breaks</option></select></label>
    </div>
    <p>Saving resets the score to 0–0.</p>
    <div class="two">
      <button type="button" id="setCancel">Cancel</button>
      <button type="submit" class="primary">Start match</button>
    </div>
  </form>
</div>

<div class="sheet" id="logSheet" hidden>
  <div class="card">
    <h2>Racks</h2>
    <div class="log" id="log"></div>
    <button id="logClose">Close</button>
  </div>
</div>

<div class="sheet" id="winSheet" hidden>
  <div class="card win">
    <h2 id="winTitle"></h2>
    <p id="winSub"></p>
    <div class="two">
      <button id="winUndo">Undo last rack</button>
      <button class="primary" id="winNew">Rematch</button>
    </div>
  </div>
</div>

<script>
(() => {
  const KEY = 'poolar-deck-v1';
  const fresh = () => ({ names:['BCA Shag','Terry'], race:[5,5], firstBreak:1, mode:'alt', racks:[] });
  let st;
  try { st = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { st = fresh(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };
  const $ = id => document.getElementById(id);

  const scores = () => { const s=[0,0]; st.racks.forEach(r => s[r.w]++); return s; };
  // Who breaks the next rack: a manual swap wins, else follow the break rule from the last rack.
  const breaker = () => {
    const n = st.racks.length;
    if (st.fix && st.fix.n === n) return st.fix.b;
    if (!n) return st.firstBreak;
    const r = st.racks[n-1];
    return st.mode==='alt' ? 1-r.b : st.mode==='win' ? r.w : 1-r.w;
  };
  const winner = s => s[0]>=st.race[0] ? 0 : s[1]>=st.race[1] ? 1 : -1;

  function render(){
    const s = scores(), b = breaker(), w = winner(s);
    $('raceLbl').firstChild.textContent = `Race ${st.race[0]}–${st.race[1]}`;
    $('rackNo').textContent = w<0 ? `Rack ${st.racks.length+1}` : 'Final';
    for (const i of [0,1]) {
      $('n'+i).textContent = st.names[i];
      $('s'+i).textContent = s[i];
      const left = st.race[i]-s[i];
      $('d'+i).textContent = left<=0 ? 'Wins' : left===1 ? 'Hill · needs 1' : `Needs ${left}`;
      $('b'+i).hidden = !(w<0 && b===i);
      $('p'+i).classList.toggle('breaking', w<0 && b===i);
      $('p'+i).setAttribute('aria-label', `${st.names[i]} won the rack. Score ${s[i]}`);
      $('k'+i).innerHTML = Array.from({length:st.race[i]},(_,j)=>`<span class="pip${j<s[i]?' on':''}"></span>`).join('');
    }
    $('undo').disabled = !st.racks.length;
    $('swap').disabled = w>=0;
    $('winSheet').hidden = w<0;
    if (w>=0) {
      $('winTitle').textContent = `${st.names[w]} wins`;
      $('winSub').textContent = `${s[w]}–${s[1-w]} in a race to ${st.race[w]}–${st.race[1-w]}, ${st.racks.length} racks.`;
    }
  }

  let wake;
  const keepAwake = async () => { try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>wake=null); } } catch {} };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') keepAwake(); });

  function score(i){
    if (winner(scores())>=0) return;
    st.racks.push({ w:i, b:breaker(), t:Date.now() });
    save(); render(); keepAwake();
    const p=$('p'+i); p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash');
    try { navigator.vibrate && navigator.vibrate(30); } catch {}
  }
  for (const i of [0,1]) {
    $('p'+i).addEventListener('click', () => score(i));
    $('p'+i).addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); score(i); } });
  }
  const undo = () => { st.racks.pop(); st.fix = null; save(); render(); };
  $('undo').onclick = undo; $('winUndo').onclick = undo;
  $('swap').onclick = () => {
    const b = 1 - breaker();
    if (!st.racks.length) { st.firstBreak = b; st.fix = null; } else st.fix = { n: st.racks.length, b };
    save(); render();
  };
  $('winNew').onclick = () => { st.racks=[]; st.fix=null; st.firstBreak = 1-st.firstBreak; save(); render(); };

  $('logBtn').onclick = () => {
    const run=[0,0];
    $('log').innerHTML = st.racks.length ? st.racks.map((r,i)=>{ run[r.w]++;
      const t=new Date(r.t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
      return `<div><span>${i+1}. ${esc(st.names[r.w])}${r.w===r.b?' (on break)':''}</span><span>${run[0]}–${run[1]} · ${t}</span></div>`; }).join('')
      : '<p>No racks yet.</p>';
    $('logSheet').hidden=false;
  };
  $('logClose').onclick = () => $('logSheet').hidden=true;
  const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  $('setBtn').onclick = () => {
    for (const i of [0,1]) { $('fn'+i).value=st.names[i]; $('fr'+i).value=st.race[i]; }
    $('fb').options[0].text=st.names[0]; $('fb').options[1].text=st.names[1];
    $('fb').value=String(st.firstBreak); $('fm').value=st.mode; $('setup').hidden=false;
  };
  $('setCancel').onclick = () => $('setup').hidden=true;
  $('setupForm').addEventListener('submit', e => {
    e.preventDefault();
    for (const i of [0,1]) {
      st.names[i] = $('fn'+i).value.trim() || st.names[i];
      st.race[i] = Math.max(1, Math.min(99, parseInt($('fr'+i).value,10) || 5));
    }
    st.firstBreak=+$('fb').value; st.mode=$('fm').value; st.racks=[]; st.fix=null;
    save(); $('setup').hidden=true; render();
  });

  render();
})();
</script>
</body></html>
