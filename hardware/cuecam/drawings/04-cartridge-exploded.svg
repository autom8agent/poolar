<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="700" viewBox="0 0 1580 700" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title>CueCam 04 - camera cartridge, exploded</title>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" fill="#5b6478"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" fill="#2f6bff"/></marker>
<marker id="as" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
  <path d="M9,0 L0,4.5 L9,9 z" fill="#5b6478"/></marker>
<pattern id="hatch" width="7" height="7" patternTransform="rotate(45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="7" stroke="#2b3240" stroke-width="1.6" opacity="0.55"/>
</pattern>
<pattern id="hatch2" width="6" height="6" patternTransform="rotate(-45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="6" stroke="#aab3c4" stroke-width="2" opacity="0.9"/>
</pattern>
<pattern id="hatch3" width="5" height="5" patternTransform="rotate(45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="5" stroke="#c9760f" stroke-width="1.6" opacity="0.6"/>
</pattern>
<linearGradient id="cf" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#4a5568"/><stop offset="0.35" stop-color="#1c2331"/>
  <stop offset="0.62" stop-color="#2c3648"/><stop offset="1" stop-color="#0d1219"/>
</linearGradient>
<linearGradient id="cf2" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#57637a"/><stop offset="0.4" stop-color="#232c3b"/>
  <stop offset="1" stop-color="#0b0f16"/></linearGradient>
<linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#e8ecf3"/><stop offset="0.45" stop-color="#b3bccd"/>
  <stop offset="1" stop-color="#7e8798"/></linearGradient>
</defs>
<rect x="0.00" y="0.00" width="1580.00" height="700.00" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34.00" y="44.00" font-size="22" fill="#141a26" font-weight="700" text-anchor="start">CueCam 04 - camera cartridge, exploded</text>
<text x="34.00" y="68.00" font-size="13" fill="#5b6478" font-weight="400" text-anchor="start">The whole camera is one removable cartridge. A mass-matched blank slug takes its place so the cue plays identically either way.</text>
<rect x="96.00" y="248.00" width="1046.00" height="104.00" rx="10" fill="none" stroke="#5b6478" stroke-width="1.1" stroke-dasharray="9 6"/>
<line x1="153.00" y1="300.00" x2="187.00" y2="300.00" stroke="#98a2b6" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="265.00" y1="300.00" x2="291.00" y2="300.00" stroke="#98a2b6" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="453.00" y1="300.00" x2="515.00" y2="300.00" stroke="#98a2b6" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="605.00" y1="300.00" x2="674.00" y2="300.00" stroke="#98a2b6" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="726.00" y1="300.00" x2="767.00" y2="300.00" stroke="#98a2b6" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="845.00" y1="300.00" x2="864.00" y2="300.00" stroke="#98a2b6" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="996.00" y1="300.00" x2="1076.00" y2="300.00" stroke="#98a2b6" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="73.00" y="277.00" width="74.00" height="46.00" rx="6" fill="#cfe4ff" stroke="#2f6bff" stroke-width="1.6"/>
<text x="110.00" y="380.00" font-size="11.5" fill="#141a26" font-weight="700" text-anchor="middle">nose cap</text>
<text x="110.00" y="395.00" font-size="11.5" fill="#141a26" font-weight="400" text-anchor="middle">+ window</text>
<text x="110.00" y="232.00" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">1.6 g</text>
<rect x="193.00" y="274.00" width="66.00" height="52.00" rx="6" fill="#ffe4f5" stroke="#c81fa8" stroke-width="1.6"/>
<text x="226.00" y="380.00" font-size="11.5" fill="#141a26" font-weight="700" text-anchor="middle">TPU shock</text>
<text x="226.00" y="395.00" font-size="11.5" fill="#141a26" font-weight="400" text-anchor="middle">boot, front</text>
<text x="226.00" y="232.00" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">1.0 g</text>
<rect x="297.00" y="287.00" width="150.00" height="26.00" rx="6" fill="#d8f3e4" stroke="#0e9c58" stroke-width="1.6"/>
<text x="372.00" y="380.00" font-size="11.5" fill="#141a26" font-weight="700" text-anchor="middle">camera PCB</text>
<text x="372.00" y="395.00" font-size="11.5" fill="#141a26" font-weight="400" text-anchor="middle">16 x 58 mm</text>
<text x="372.00" y="232.00" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">7.2 g</text>
<rect x="521.00" y="278.00" width="78.00" height="44.00" rx="6" fill="#e8eefc" stroke="#141a26" stroke-width="1.6"/>
<text x="560.00" y="380.00" font-size="11.5" fill="#141a26" font-weight="700" text-anchor="middle">LiPo 402040</text>
<text x="560.00" y="395.00" font-size="11.5" fill="#141a26" font-weight="400" text-anchor="middle">400 mAh</text>
<text x="560.00" y="232.00" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">8.1 g</text>
<rect x="680.00" y="285.00" width="40.00" height="30.00" rx="6" fill="#f6f0d8" stroke="#c9760f" stroke-width="1.6"/>
<text x="700.00" y="380.00" font-size="11.5" fill="#141a26" font-weight="700" text-anchor="middle">microSD +</text>
<text x="700.00" y="395.00" font-size="11.5" fill="#141a26" font-weight="400" text-anchor="middle">retainer</text>
<text x="700.00" y="232.00" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">0.9 g</text>
<rect x="773.00" y="274.00" width="66.00" height="52.00" rx="6" fill="#ffe4f5" stroke="#c81fa8" stroke-width="1.6"/>
<text x="806.00" y="380.00" font-size="11.5" fill="#141a26" font-weight="700" text-anchor="middle">TPU shock</text>
<text x="806.00" y="395.00" font-size="11.5" fill="#141a26" font-weight="400" text-anchor="middle">boot, rear</text>
<text x="806.00" y="232.00" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">1.1 g</text>
<rect x="870.00" y="269.00" width="120.00" height="62.00" rx="6" fill="#f4f6fa" stroke="#141a26" stroke-width="1.6"/>
<text x="930.00" y="380.00" font-size="11.5" fill="#141a26" font-weight="700" text-anchor="middle">cartridge</text>
<text x="930.00" y="395.00" font-size="11.5" fill="#141a26" font-weight="400" text-anchor="middle">shell</text>
<text x="930.00" y="232.00" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">4.4 g</text>
<rect x="1082.00" y="271.00" width="56.00" height="58.00" rx="6" fill="#e7ebf2" stroke="#aab3c4" stroke-width="1.6"/>
<text x="1110.00" y="380.00" font-size="11.5" fill="#141a26" font-weight="700" text-anchor="middle">tail cap +</text>
<text x="1110.00" y="395.00" font-size="11.5" fill="#141a26" font-weight="400" text-anchor="middle">bayonet lugs</text>
<text x="1110.00" y="232.00" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">0.7 g</text>
<text x="1172.00" y="304.00" font-size="12" fill="#5b6478" font-weight="700" text-anchor="start">→ into the collar bore</text>
<rect x="40.00" y="452.00" width="740.00" height="210.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="52.00" y="472.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">Total cartridge mass: 25.0 g</text>
<text x="56.00" y="490.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">25 g at the 1/3 station is not 25 g of cue. The station is 470 mm ahead of the</text>
<text x="56.00" y="507.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">balance point, so holding the balance costs another 1.44 g of butt ballast</text>
<text x="56.00" y="524.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">per gram up front - 61 g of finished cue weight for a 25 g camera.</text>
<text x="56.00" y="541.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="56.00" y="558.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">That lever is the reason the cartridge is a mass budget rather than a parts list.</text>
<text x="56.00" y="575.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Every gram you save here you save twice. Run tools/balance.py after any change.</text>
<rect x="800.00" y="452.00" width="740.00" height="210.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="812.00" y="472.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">The blank slug</text>
<text x="816.00" y="490.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Pop the camera out and the bay is empty - 25 g gone from the worst possible</text>
<text x="816.00" y="507.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">place, and the cue is suddenly butt-heavy and rattles. So the kit includes a</text>
<text x="816.00" y="524.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">blank: a printed shell with a brass core, turned down on a scale until it</text>
<text x="816.00" y="541.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">matches the camera cartridge to within 0.5 g.</text>
<text x="816.00" y="558.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="816.00" y="575.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">League night: blank in, nothing to declare, cue plays exactly as it did in practice.</text>
</svg>