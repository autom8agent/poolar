<text x="1275.00" y="168.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">1.2 mm wall, 20% gyroid</text>
<circle cx="834.00" cy="392.40" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
