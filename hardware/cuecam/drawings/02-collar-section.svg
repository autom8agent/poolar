<line x1="1030.00" y1="604.00" x2="1030.00" y2="614.00" stroke="#5b6478" stroke-width="1"/>
<line x1="540.00" y1="609.00" x2="1030.00" y2="609.00" stroke="#5b6478" stroke-width="1" marker-start="url(#as)" marker-end="url(#a)"/>
<text x="785.00" y="602.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">70.0 mm cartridge bay</text>
<rect x="300.00" y="676.00" width="690.00" height="130.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="312.00" y="696.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">Collar diameter is the whole design fight</text>
<text x="312.00" y="734.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">The cue is only ⌀14.2 mm at this station, so any camera makes a bump. How big</text>
<text x="312.00" y="750.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">is set by the WIDEST dimension of the electronics, not by the sensor:</text>
<text x="312.00" y="766.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">    16 mm custom PCB, stood on edge   →  ⌀24.0 mm collar   (this drawing)</text>
<text x="312.00" y="782.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">    19 mm RunCam Thumb Pro, de-cased  →  ⌀29.0 mm collar   (fast path)</text>
<text x="312.00" y="798.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">    21 mm cased action camera        →  ⌀33 mm - unplayable, don&#x27;t</text>
<text x="312.00" y="814.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">POD_OD is a parameter in cad/collar.scad. Print whichever you are building.</text>
<rect x="1020.00" y="676.00" width="540.00" height="130.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="1032.00" y="696.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">Shock case</text>
<text x="1032.00" y="734.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Tip-to-ball contact lasts about 1 ms and takes the cue from</text>
<text x="1032.00" y="750.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">~7 m/s to ~2 m/s. That is roughly 500 g of axial deceleration,</text>
<text x="1032.00" y="766.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">every shot, thousands of times. Nothing in the cartridge is</text>
<text x="1032.00" y="782.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">held by tape or friction: the cell sits in a captive pocket, the</text>
<text x="1032.00" y="798.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">card is retained, and the whole cartridge floats on the TPU boot.</text>
<text x="1032.00" y="814.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Bayonet lugs take the load in shear, not the detent.</text>
</svg>