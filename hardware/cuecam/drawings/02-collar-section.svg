<circle cx="652.00" cy="472.20" r="2.20" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M652.00,472.20 L225.00,527.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
<text x="220.00" y="531.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">⌀19.2 bore</text>
