<text x="1275.00" y="254.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">captive pocket - never taped</text>
<circle cx="939.00" cy="361.60" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M939.00,361.60 L1242.00,322.00 L1268.00,322.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
<text x="1275.00" y="326.00" font-size="11.5" fill="#5b6478" font-weight="700" text-anchor="start">microSD, push-push</text>
<text x="1275.00" y="340.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">+ printed retainer clip</text>
<circle cx="1065.00" cy="328.00" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M1065.00,328.00 L1242.00,408.00 L1268.00,408.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
<text x="1275.00" y="412.00" font-size="11.5" fill="#5b6478" font-weight="700" text-anchor="start">bayonet ring + ejector</text>
<text x="1275.00" y="426.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">spring - see drawing 05</text>
<circle cx="1079.00" cy="465.20" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M1079.00,465.20 L1242.00,494.00 L1268.00,494.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
<text x="1275.00" y="498.00" font-size="11.5" fill="#5b6478" font-weight="700" text-anchor="start">0.8 mm vent, PTFE membrane</text>
<text x="1275.00" y="512.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">stops the pod pumping dust</text>
