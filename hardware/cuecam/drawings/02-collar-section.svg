<text x="293.00" y="242.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="end">bonded flush with the barrel</text>
<circle cx="571.50" cy="302.10" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M571.50,302.10 L326.00,320.00 L300.00,320.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
<text x="293.00" y="324.00" font-size="11.5" fill="#5b6478" font-weight="700" text-anchor="end">1/4&quot; sensor + M12 lens, 150°</text>
<text x="293.00" y="338.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="end">axis PARALLEL to the cue - max</text>
<text x="293.00" y="352.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="end">down-tilt 0.67° before the shaft</text>
<text x="293.00" y="366.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="end">blocks it (tools/optics.py)</text>
<circle cx="701.00" cy="392.40" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M701.00,392.40 L326.00,440.00 L300.00,440.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
<text x="293.00" y="444.00" font-size="11.5" fill="#5b6478" font-weight="700" text-anchor="end">camera PCB, 16 mm wide</text>
<text x="293.00" y="458.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="end">long-and-thin is what keeps</text>
<text x="293.00" y="472.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="end">the collar down to ⌀24</text>
<circle cx="911.00" cy="351.10" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M911.00,351.10 L1242.00,150.00 L1268.00,150.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
