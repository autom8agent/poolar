<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="720" viewBox="0 0 1580 720" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title>CueCam 09 - getting the footage onto your phone</title>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" fill="#5b6478"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" fill="#2f6bff"/></marker>
<marker id="as" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
  <path d="M9,0 L0,4.5 L9,9 z" fill="#5b6478"/></marker>
<pattern id="hatch" width="7" height="7" patternTransform="rotate(45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="7" stroke="#2b3240" stroke-width="1.6" opacity="0.55"/>
</pattern>
<pattern id="hatch2" width="6" height="6" patternTransform="rotate(-45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="6" stroke="#aab3c4" stroke-width="2" opacity="0.9"/>
</pattern>
<pattern id="hatch3" width="5" height="5" patternTransform="rotate(45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="5" stroke="#c9760f" stroke-width="1.6" opacity="0.6"/>
</pattern>
<linearGradient id="cf" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#4a5568"/><stop offset="0.35" stop-color="#1c2331"/>
  <stop offset="0.62" stop-color="#2c3648"/><stop offset="1" stop-color="#0d1219"/>
</linearGradient>
<linearGradient id="cf2" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#57637a"/><stop offset="0.4" stop-color="#232c3b"/>
  <stop offset="1" stop-color="#0b0f16"/></linearGradient>
<linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#e8ecf3"/><stop offset="0.45" stop-color="#b3bccd"/>
  <stop offset="1" stop-color="#7e8798"/></linearGradient>
</defs>
<rect x="0.00" y="0.00" width="1580.00" height="720.00" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34.00" y="44.00" font-size="22" fill="#141a26" font-weight="700" text-anchor="start">CueCam 09 - getting the footage onto your phone</text>
<text x="34.00" y="68.00" font-size="13" fill="#5b6478" font-weight="400" text-anchor="start">Card-first. No pairing, no app-in-the-middle, nothing to go wrong at the table.</text>
<rect x="60.00" y="210.00" width="250.00" height="130.00" rx="12" fill="#ffffff" stroke="#2f6bff" stroke-width="2"/>
<text x="185.00" y="250.00" font-size="15" fill="#141a26" font-weight="700" text-anchor="middle">Twist + pop</text>
<text x="185.00" y="278.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">collar ring 28°,</text>
<text x="185.00" y="295.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">cartridge ejects 9 mm</text>
<text x="74.00" y="196.00" font-size="12" fill="#2f6bff" font-weight="700" text-anchor="start">1</text>
<line x1="318.00" y1="275.00" x2="344.00" y2="275.00" stroke="#98a2b6" stroke-width="2" marker-end="url(#a)"/>
<rect x="352.00" y="210.00" width="250.00" height="130.00" rx="12" fill="#ffffff" stroke="#2f6bff" stroke-width="2"/>
<text x="477.00" y="250.00" font-size="15" fill="#141a26" font-weight="700" text-anchor="middle">Card out</text>
<text x="477.00" y="278.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">push-push microSD,</text>
<text x="477.00" y="295.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">or USB-C the whole pod</text>
<text x="366.00" y="196.00" font-size="12" fill="#2f6bff" font-weight="700" text-anchor="start">2</text>
<line x1="610.00" y1="275.00" x2="636.00" y2="275.00" stroke="#98a2b6" stroke-width="2" marker-end="url(#a)"/>
<rect x="644.00" y="210.00" width="250.00" height="130.00" rx="12" fill="#ffffff" stroke="#2f6bff" stroke-width="2"/>
<text x="769.00" y="250.00" font-size="15" fill="#141a26" font-weight="700" text-anchor="middle">USB-C reader</text>
<text x="769.00" y="278.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">£6 adapter,</text>
<text x="769.00" y="295.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">lives in the cue case</text>
<text x="658.00" y="196.00" font-size="12" fill="#2f6bff" font-weight="700" text-anchor="start">3</text>
<line x1="902.00" y1="275.00" x2="928.00" y2="275.00" stroke="#98a2b6" stroke-width="2" marker-end="url(#a)"/>
<rect x="936.00" y="210.00" width="250.00" height="130.00" rx="12" fill="#ffffff" stroke="#0e9c58" stroke-width="2"/>
<text x="1061.00" y="250.00" font-size="15" fill="#141a26" font-weight="700" text-anchor="middle">Phone Files</text>
<text x="1061.00" y="278.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">iOS Files / Android SAF</text>
<text x="1061.00" y="295.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">sees it as a drive</text>
<text x="950.00" y="196.00" font-size="12" fill="#0e9c58" font-weight="700" text-anchor="start">4</text>
<line x1="1194.00" y1="275.00" x2="1220.00" y2="275.00" stroke="#98a2b6" stroke-width="2" marker-end="url(#a)"/>
<rect x="1228.00" y="210.00" width="250.00" height="130.00" rx="12" fill="#ffffff" stroke="#c81fa8" stroke-width="2"/>
<text x="1353.00" y="250.00" font-size="15" fill="#141a26" font-weight="700" text-anchor="middle">PoolarCam app</text>
<text x="1353.00" y="278.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">import, auto-split,</text>
<text x="1353.00" y="295.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">review, keep or bin</text>
<text x="1242.00" y="196.00" font-size="12" fill="#c81fa8" font-weight="700" text-anchor="start">5</text>
<rect x="60.00" y="400.00" width="720.00" height="280.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="72.00" y="420.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">What the app has to do that the file manager can&#x27;t</text>
<text x="78.00" y="438.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">A 40 minute card is 40 minutes of a cue lying on a table with four minutes of</text>
<text x="78.00" y="455.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">pool in it. The one job worth writing an app for is cutting it up:</text>
<text x="78.00" y="472.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="78.00" y="489.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">  •  the tip strike is a sharp, unmistakable audio transient - that is the cut</text>
<text x="78.00" y="506.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">  •  the gyro log in the same file says which way the cue was pointing</text>
<text x="78.00" y="523.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">  •  so: detect strike, take 4 s before and 3 s after, that is one shot</text>
<text x="78.00" y="540.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="78.00" y="557.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Everything after that is a list of clips with a date and a thumbnail. Tag the</text>
<text x="78.00" y="574.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">misses, delete the rest, and a session becomes 30 shots you can actually watch.</text>
<text x="78.00" y="591.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Aim overlay reuses the solver already in this repo.</text>
<rect x="800.00" y="400.00" width="720.00" height="280.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="812.00" y="420.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">The Wi-Fi version, and why it is version two</text>
<text x="818.00" y="438.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Streaming to the phone sounds better and is worse:</text>
<text x="818.00" y="455.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="818.00" y="472.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">  •  a radio in the collar is +8 g at the 1.13:1 station, so +17 g of cue</text>
<text x="818.00" y="489.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">  •  it roughly halves a 400 mAh cell&#x27;s runtime</text>
<text x="818.00" y="506.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">  •  pairing at a pub table, on someone else&#x27;s 2.4 GHz, before you can play</text>
<text x="818.00" y="523.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">  •  and it puts a transmitter inside a carbon tube, which is a Faraday cage</text>
<text x="818.00" y="540.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="818.00" y="557.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">The card path needs none of that and never fails at the table. Build v1 on the</text>
<text x="818.00" y="574.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">card. If you still want Wi-Fi after a month of using it, the cartridge is the</text>
<text x="818.00" y="591.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">part you swap - that is the entire point of making it a cartridge.</text>
</svg>