<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="720" viewBox="0 0 1580 720" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title>CueCam 07 - 9.5 mm quick-change tip</title>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" fill="#5b6478"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" fill="#2f6bff"/></marker>
<marker id="as" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
  <path d="M9,0 L0,4.5 L9,9 z" fill="#5b6478"/></marker>
<pattern id="hatch" width="7" height="7" patternTransform="rotate(45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="7" stroke="#2b3240" stroke-width="1.6" opacity="0.55"/>
</pattern>
<pattern id="hatch2" width="6" height="6" patternTransform="rotate(-45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="6" stroke="#aab3c4" stroke-width="2" opacity="0.9"/>
</pattern>
<pattern id="hatch3" width="5" height="5" patternTransform="rotate(45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="5" stroke="#c9760f" stroke-width="1.6" opacity="0.6"/>
</pattern>
<linearGradient id="cf" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#4a5568"/><stop offset="0.35" stop-color="#1c2331"/>
  <stop offset="0.62" stop-color="#2c3648"/><stop offset="1" stop-color="#0d1219"/>
</linearGradient>
<linearGradient id="cf2" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#57637a"/><stop offset="0.4" stop-color="#232c3b"/>
  <stop offset="1" stop-color="#0b0f16"/></linearGradient>
<linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#e8ecf3"/><stop offset="0.45" stop-color="#b3bccd"/>
  <stop offset="1" stop-color="#7e8798"/></linearGradient>
</defs>
<rect x="0.00" y="0.00" width="1580.00" height="720.00" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34.00" y="44.00" font-size="22" fill="#141a26" font-weight="700" text-anchor="start">CueCam 07 - 9.5 mm quick-change tip</text>
<text x="34.00" y="68.00" font-size="13" fill="#5b6478" font-weight="400" text-anchor="start">Scale 8:1. Screw-on tip pucks so a tip change is a 30 second job at the table, not a night with a lathe and a glue-up.</text>
<polygon points="430.00,212.00 798.00,208.40 798.00,291.60 430.00,288.00" fill="url(#hatch)" stroke="#141a26" stroke-width="1.4"/>
<rect x="430.00" y="212.00" width="104.00" height="76.00" rx="0" fill="#f3ead6" stroke="#141a26" stroke-width="1.4"/>
<rect x="442.00" y="225.20" width="80.00" height="49.60" rx="0" fill="#d9b25e" stroke="#141a26" stroke-width="1.2"/>
<rect x="450.00" y="238.80" width="68.00" height="22.40" rx="0" fill="#ffffff" stroke="#141a26" stroke-width="1"/>
<line x1="450.80" y1="238.80" x2="454.00" y2="261.20" stroke="#141a26" stroke-width="0.6"/>
<line x1="457.60" y1="238.80" x2="460.80" y2="261.20" stroke="#141a26" stroke-width="0.6"/>
<line x1="464.40" y1="238.80" x2="467.60" y2="261.20" stroke="#141a26" stroke-width="0.6"/>
<line x1="471.20" y1="238.80" x2="474.40" y2="261.20" stroke="#141a26" stroke-width="0.6"/>
<line x1="478.00" y1="238.80" x2="481.20" y2="261.20" stroke="#141a26" stroke-width="0.6"/>
<line x1="484.80" y1="238.80" x2="488.00" y2="261.20" stroke="#141a26" stroke-width="0.6"/>
<line x1="491.60" y1="238.80" x2="494.80" y2="261.20" stroke="#141a26" stroke-width="0.6"/>
<line x1="498.40" y1="238.80" x2="501.60" y2="261.20" stroke="#141a26" stroke-width="0.6"/>
<line x1="505.20" y1="238.80" x2="508.40" y2="261.20" stroke="#141a26" stroke-width="0.6"/>
<line x1="512.00" y1="238.80" x2="515.20" y2="261.20" stroke="#141a26" stroke-width="0.6"/>
<line x1="318.00" y1="250.00" x2="830.00" y2="250.00" stroke="#98a2b6" stroke-width="0.9" stroke-dasharray="14 4 3 4"/>
<rect x="247.60" y="212.00" width="12.80" height="76.00" rx="0" fill="#c9c2b4" stroke="#141a26" stroke-width="1.3"/>
<path d="M222.0,212.0 Q185.2,250 222.0,288.0 L247.6,288.0 L247.6,212.0 Z" fill="#6b4f2a" stroke="#141a26" stroke-width="1.4"/>
<rect x="260.40" y="239.20" width="56.00" height="21.60" rx="0" fill="#d9b25e" stroke="#141a26" stroke-width="1.2"/>
<line x1="322.00" y1="250.00" x2="422.00" y2="250.00" stroke="#98a2b6" stroke-width="1.2" stroke-dasharray="6 4"/>
<circle cx="198.00" cy="250.00" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M198.00,250.00 L974.00,140.00 L1000.00,140.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
<text x="1007.00" y="144.00" font-size="11.5" fill="#5b6478" font-weight="700" text-anchor="start">9.5 mm layered leather tip</text>
<text x="1007.00" y="158.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">pre-shaped, pre-burnished</text>
<circle cx="254.00" cy="212.00" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M254.00,212.00 L974.00,196.00 L1000.00,196.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
<text x="1007.00" y="200.00" font-size="11.5" fill="#5b6478" font-weight="700" text-anchor="start">0.8 mm phenolic backing pad</text>
<text x="1007.00" y="214.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">takes the clamp load</text>
<circle cx="286.00" cy="239.20" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M286.00,239.20 L974.00,252.00 L1000.00,252.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
<text x="1007.00" y="256.00" font-size="11.5" fill="#5b6478" font-weight="700" text-anchor="start">4-40 stainless stud, Loctite 243</text>
<text x="1007.00" y="270.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">into the pad, not the leather</text>
<circle cx="478.00" cy="225.20" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M478.00,225.20 L974.00,330.00 L1000.00,330.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
<text x="1007.00" y="334.00" font-size="11.5" fill="#5b6478" font-weight="700" text-anchor="start">brass insert, bonded into</text>
<text x="1007.00" y="348.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">the ferrule bore</text>
<circle cx="502.00" cy="212.00" r="2.40" fill="#5b6478" stroke="none" stroke-width="1"/>
<path d="M502.00,212.00 L974.00,386.00 L1000.00,386.00" fill="none" stroke="#5b6478" stroke-width="0.9"/>
<text x="1007.00" y="390.00" font-size="11.5" fill="#5b6478" font-weight="700" text-anchor="start">⌀9.5 mm carbon-loaded ferrule</text>
<text x="1007.00" y="404.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">13 mm long, 3.4 g</text>
<line x1="153.00" y1="212.00" x2="163.00" y2="212.00" stroke="#5b6478" stroke-width="1"/>
<line x1="153.00" y1="288.00" x2="163.00" y2="288.00" stroke="#5b6478" stroke-width="1"/>
<line x1="158.00" y1="212.00" x2="158.00" y2="288.00" stroke="#5b6478" stroke-width="1" marker-start="url(#as)" marker-end="url(#a)"/>
<text x="166.00" y="254.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">⌀9.5</text>
<rect x="40.00" y="452.00" width="740.00" height="240.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="52.00" y="472.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">The 9.5 mm decision</text>
<text x="58.00" y="492.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">9.5 mm is a snooker tip, not a pool tip - most pool shafts are 11.75-12.4 mm.</text>
<text x="58.00" y="509.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">On a 9.5 mm carbon shaft you get:</text>
<text x="58.00" y="526.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="58.00" y="543.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">  + very low deflection; the thin, stiff shaft squirts the cue ball less</text>
<text x="58.00" y="560.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">  + a lot more spin for the same offset, because you can hit further out</text>
<text x="58.00" y="577.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">  − a much smaller margin for error - a miscue is 1-2 mm away, not 3-4</text>
<text x="58.00" y="594.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">  − the ferrule bore is only ~6 mm, so the insert thread has to be 4-40</text>
<text x="58.00" y="611.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="58.00" y="628.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">It is the right tip for a practice cue you are filming. It is an unforgiving</text>
<text x="58.00" y="645.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">tip to break with - another reason the break cue stays a separate cue.</text>
<rect x="800.00" y="452.00" width="740.00" height="240.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="812.00" y="472.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">Changing a tip at the table</text>
<text x="818.00" y="492.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">1.  Printed spanner over the ferrule flats, thumb on the puck, quarter turn.</text>
<text x="818.00" y="509.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">2.  Old puck off. Wipe the shoulder.</text>
<text x="818.00" y="526.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">3.  New puck on, finger tight, then the spanner until the pad seats flat</text>
<text x="818.00" y="543.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">    against the ferrule - the shoulder does the locating, not the thread.</text>
<text x="818.00" y="560.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">4.  Play.</text>
<text x="818.00" y="577.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="818.00" y="594.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Pucks are prepared in advance: leather bonded to pad, stud set with Loctite,</text>
<text x="818.00" y="611.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">shaped and burnished off the cue. Carry three in the case. A tip change stops</text>
<text x="818.00" y="628.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">being an evening&#x27;s work and becomes a decision you make mid-session.</text>
</svg>