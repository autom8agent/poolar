<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="700" viewBox="0 0 1580 700" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title>CueCam 05 - bayonet pop-out mechanism</title>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" fill="#5b6478"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" fill="#2f6bff"/></marker>
<marker id="as" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
  <path d="M9,0 L0,4.5 L9,9 z" fill="#5b6478"/></marker>
<pattern id="hatch" width="7" height="7" patternTransform="rotate(45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="7" stroke="#2b3240" stroke-width="1.6" opacity="0.55"/>
</pattern>
<pattern id="hatch2" width="6" height="6" patternTransform="rotate(-45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="6" stroke="#aab3c4" stroke-width="2" opacity="0.9"/>
</pattern>
<pattern id="hatch3" width="5" height="5" patternTransform="rotate(45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="5" stroke="#c9760f" stroke-width="1.6" opacity="0.6"/>
</pattern>
<linearGradient id="cf" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#4a5568"/><stop offset="0.35" stop-color="#1c2331"/>
  <stop offset="0.62" stop-color="#2c3648"/><stop offset="1" stop-color="#0d1219"/>
</linearGradient>
<linearGradient id="cf2" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#57637a"/><stop offset="0.4" stop-color="#232c3b"/>
  <stop offset="1" stop-color="#0b0f16"/></linearGradient>
<linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#e8ecf3"/><stop offset="0.45" stop-color="#b3bccd"/>
  <stop offset="1" stop-color="#7e8798"/></linearGradient>
</defs>
<rect x="0.00" y="0.00" width="1580.00" height="700.00" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34.00" y="44.00" font-size="22" fill="#141a26" font-weight="700" text-anchor="start">CueCam 05 - bayonet pop-out mechanism</text>
<text x="34.00" y="68.00" font-size="13" fill="#5b6478" font-weight="400" text-anchor="start">Quarter-turn bayonet with a sprung ejector. No push-push latch: a 500 g axial shock every shot would eventually fire one.</text>
<text x="270.00" y="118.00" font-size="14" fill="#141a26" font-weight="700" text-anchor="middle">1  LOCKED</text>
<rect x="120.00" y="208.00" width="220.00" height="84.00" rx="8" fill="url(#cf2)" stroke="#141a26" stroke-width="1.4"/>
<rect x="270.00" y="218.00" width="150.00" height="64.00" rx="6" fill="#fdf1f9" stroke="#c81fa8" stroke-width="1.7"/>
<rect x="326.00" y="204.00" width="26.00" height="92.00" rx="0" fill="url(#hatch2)" stroke="#141a26" stroke-width="1.4"/>
<line x1="329.00" y1="206.00" x2="329.00" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="331.60" y1="206.00" x2="331.60" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="334.20" y1="206.00" x2="334.20" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="336.80" y1="206.00" x2="336.80" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="339.40" y1="206.00" x2="339.40" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="342.00" y1="206.00" x2="342.00" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="344.60" y1="206.00" x2="344.60" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="347.20" y1="206.00" x2="347.20" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="349.80" y1="206.00" x2="349.80" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<text x="120.00" y="334.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Lugs sit past the detent bump. Axial shock loads</text>
<text x="120.00" y="350.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">them in shear against the track wall.</text>
<text x="710.00" y="118.00" font-size="14" fill="#141a26" font-weight="700" text-anchor="middle">2  TWISTED 28°</text>
<rect x="560.00" y="208.00" width="220.00" height="84.00" rx="8" fill="url(#cf2)" stroke="#141a26" stroke-width="1.4"/>
<rect x="710.00" y="218.00" width="150.00" height="64.00" rx="6" fill="#fdf1f9" stroke="#c81fa8" stroke-width="1.7"/>
<rect x="766.00" y="204.00" width="26.00" height="92.00" rx="0" fill="url(#hatch2)" stroke="#141a26" stroke-width="1.4"/>
<line x1="769.00" y1="206.00" x2="769.00" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="771.60" y1="206.00" x2="771.60" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="774.20" y1="206.00" x2="774.20" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="776.80" y1="206.00" x2="776.80" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="779.40" y1="206.00" x2="779.40" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="782.00" y1="206.00" x2="782.00" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="784.60" y1="206.00" x2="784.60" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="787.20" y1="206.00" x2="787.20" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="789.80" y1="206.00" x2="789.80" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<path d="M756,188 A 34,34 0 0 1 804,196" fill="none" stroke="#2f6bff" stroke-width="2.6" marker-end="url(#ab)"/>
<text x="814.00" y="200.00" font-size="12.5" fill="#2f6bff" font-weight="700" text-anchor="start">28°</text>
<text x="560.00" y="334.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Thumb rolls the knurled ring 28°. The detent</text>
<text x="560.00" y="350.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">clicks over; lugs reach the axial slot.</text>
<text x="1150.00" y="118.00" font-size="14" fill="#141a26" font-weight="700" text-anchor="middle">3  EJECTED</text>
<rect x="1000.00" y="208.00" width="220.00" height="84.00" rx="8" fill="url(#cf2)" stroke="#141a26" stroke-width="1.4"/>
<rect x="1234.00" y="218.00" width="150.00" height="64.00" rx="6" fill="#fdf1f9" stroke="#c81fa8" stroke-width="1.7"/>
<rect x="1206.00" y="204.00" width="26.00" height="92.00" rx="0" fill="url(#hatch2)" stroke="#141a26" stroke-width="1.4"/>
<line x1="1209.00" y1="206.00" x2="1209.00" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="1211.60" y1="206.00" x2="1211.60" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="1214.20" y1="206.00" x2="1214.20" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="1216.80" y1="206.00" x2="1216.80" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="1219.40" y1="206.00" x2="1219.40" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="1222.00" y1="206.00" x2="1222.00" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="1224.60" y1="206.00" x2="1224.60" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="1227.20" y1="206.00" x2="1227.20" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<line x1="1229.80" y1="206.00" x2="1229.80" y2="294.00" stroke="#141a26" stroke-width="0.6"/>
<path d="M1196,188 A 34,34 0 0 1 1244,196" fill="none" stroke="#2f6bff" stroke-width="2.6" marker-end="url(#ab)"/>
<text x="1254.00" y="200.00" font-size="12.5" fill="#2f6bff" font-weight="700" text-anchor="start">28°</text>
<line x1="1384.00" y1="302.00" x2="1424.00" y2="302.00" stroke="#0e9c58" stroke-width="2.4" marker-end="url(#a)"/>
<text x="1430.00" y="306.00" font-size="12" fill="#0e9c58" font-weight="700" text-anchor="start">9 mm</text>
<text x="1000.00" y="334.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">The spring pushes the cartridge out 9 mm.</text>
<text x="1000.00" y="350.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Two fingers pull it clear.</text>
<rect x="40.00" y="396.00" width="740.00" height="250.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="52.00" y="416.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">Bayonet track, developed flat (one of two, 180° apart)</text>
<rect x="90.00" y="470.00" width="620.00" height="92.00" rx="0" fill="#f0f3f8" stroke="#98a2b6" stroke-width="1"/>
<rect x="130.00" y="470.00" width="34.00" height="56.00" rx="0" fill="#ffffff" stroke="#141a26" stroke-width="1.6"/>
<rect x="130.00" y="500.00" width="300.00" height="26.00" rx="0" fill="#ffffff" stroke="#141a26" stroke-width="1.6"/>
<path d="M390,500 q 14,13 28,0" fill="none" stroke="#141a26" stroke-width="1.6"/>
<rect x="418.00" y="500.00" width="46.00" height="26.00" rx="0" fill="#e9f7ef" stroke="#0e9c58" stroke-width="1.6"/>
<circle cx="441.00" cy="513.00" r="9.00" fill="#aab3c4" stroke="#141a26" stroke-width="1.2"/>
<text x="441.00" y="492.00" font-size="11" fill="#0e9c58" font-weight="700" text-anchor="middle">lug, locked</text>
<text x="147.00" y="462.00" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">insert</text>
<text x="280.00" y="548.00" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">28° rotation</text>
<text x="404.00" y="550.00" font-size="11" fill="#c9760f" font-weight="400" text-anchor="middle">detent</text>
<line x1="130.00" y1="573.00" x2="130.00" y2="583.00" stroke="#5b6478" stroke-width="1"/>
<line x1="464.00" y1="573.00" x2="464.00" y2="583.00" stroke="#5b6478" stroke-width="1"/>
<line x1="130.00" y1="578.00" x2="464.00" y2="578.00" stroke="#5b6478" stroke-width="1" marker-start="url(#as)" marker-end="url(#a)"/>
<text x="297.00" y="571.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">28° = 5.9 mm at ⌀24</text>
<rect x="800.00" y="396.00" width="740.00" height="250.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="812.00" y="416.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">Why not a push-push latch</text>
<text x="816.00" y="434.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">A push-push (ballpoint / SD-slot) latch is the obvious choice and it is the</text>
<text x="816.00" y="451.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">wrong one here. It stores its release in an axial cam, and the cue delivers a</text>
<text x="816.00" y="468.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">~500 g axial spike into that cam on every single shot. Sooner or later it</text>
<text x="816.00" y="485.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">indexes on its own and the cartridge leaves the cue at speed, mid-break.</text>
<text x="816.00" y="502.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="816.00" y="519.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">The bayonet needs rotation the shot cannot supply, holds the load in shear</text>
<text x="816.00" y="536.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">across two steel lugs rather than a plastic cam, and still opens one-handed.</text>
<text x="816.00" y="553.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">The detent is a comfort feature, not the retention - pull the ring off and</text>
<text x="816.00" y="570.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">the lugs still cannot leave the track without being turned.</text>
</svg>