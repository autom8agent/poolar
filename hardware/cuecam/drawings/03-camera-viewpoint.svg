<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="760" viewBox="0 0 1580 760" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title>CueCam 03 - camera viewpoint</title>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" fill="#5b6478"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" fill="#2f6bff"/></marker>
<marker id="as" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
  <path d="M9,0 L0,4.5 L9,9 z" fill="#5b6478"/></marker>
<pattern id="hatch" width="7" height="7" patternTransform="rotate(45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="7" stroke="#2b3240" stroke-width="1.6" opacity="0.55"/>
</pattern>
<pattern id="hatch2" width="6" height="6" patternTransform="rotate(-45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="6" stroke="#aab3c4" stroke-width="2" opacity="0.9"/>
</pattern>
<pattern id="hatch3" width="5" height="5" patternTransform="rotate(45)"
         patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="5" stroke="#c9760f" stroke-width="1.6" opacity="0.6"/>
</pattern>
<linearGradient id="cf" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#4a5568"/><stop offset="0.35" stop-color="#1c2331"/>
  <stop offset="0.62" stop-color="#2c3648"/><stop offset="1" stop-color="#0d1219"/>
</linearGradient>
<linearGradient id="cf2" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#57637a"/><stop offset="0.4" stop-color="#232c3b"/>
  <stop offset="1" stop-color="#0b0f16"/></linearGradient>
<linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#e8ecf3"/><stop offset="0.45" stop-color="#b3bccd"/>
  <stop offset="1" stop-color="#7e8798"/></linearGradient>
</defs>
<rect x="0.00" y="0.00" width="1580.00" height="760.00" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34.00" y="44.00" font-size="22" fill="#141a26" font-weight="700" text-anchor="start">CueCam 03 - camera viewpoint</text>
<text x="34.00" y="68.00" font-size="13" fill="#5b6478" font-weight="400" text-anchor="start">Left: FOV geometry in plan. Right: simulated frame with the Pool AR overlay drawn on top.</text>
<rect x="40.00" y="92.00" width="720.00" height="560.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="52.00" y="112.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">Plan view - lens at 533 mm behind the tip, 150° FOV</text>
<clipPath id="clip1"><rect x="44" y="122" width="712" height="526"/></clipPath>
<g clip-path="url(#clip1)">
<path d="M700.0,380.0 L498.1,1133.4 A780.0,780.0 0 0 1 498.1,-373.4 Z" fill="#2f6bff" opacity="0.1"/>
<path d="M700.0,380.0 L498.1,1133.4 A780.0,780.0 0 0 1 498.1,-373.4 Z" fill="none" stroke="#2f6bff" stroke-width="1" stroke-dasharray="6 5"/>
</g>
<text x="490.00" y="232.00" font-size="11.5" fill="#2f6bff" font-weight="400" text-anchor="middle">150° horizontal FOV</text>
<line x1="700.00" y1="380.00" x2="393.50" y2="380.00" stroke="#2b3240" stroke-width="7"/>
<line x1="692.00" y1="380.00" x2="740.00" y2="380.00" stroke="#2b3240" stroke-width="11"/>
<circle cx="698.00" cy="371.00" r="5.00" fill="#2f6bff" stroke="#141a26" stroke-width="1"/>
<text x="752.00" y="384.00" font-size="11" fill="#5b6478" font-weight="400" text-anchor="start">collar</text>
<circle cx="380.00" cy="380.00" r="14.29" fill="#ffffff" stroke="#141a26" stroke-width="1.4"/>
<text x="380.00" y="357.71" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">cue ball</text>
<circle cx="110.00" cy="230.00" r="14.29" fill="#f0c419" stroke="#141a26" stroke-width="1.4"/>
<text x="110.00" y="207.71" font-size="11" fill="#5b6478" font-weight="400" text-anchor="middle">object ball</text>
<line x1="380.00" y1="380.00" x2="110.00" y2="230.00" stroke="#c81fa8" stroke-width="1.6" stroke-dasharray="7 5"/>
<line x1="433.50" y1="525.00" x2="433.50" y2="535.00" stroke="#5b6478" stroke-width="1"/>
<line x1="700.00" y1="525.00" x2="700.00" y2="535.00" stroke="#5b6478" stroke-width="1"/>
<line x1="433.50" y1="530.00" x2="700.00" y2="530.00" stroke="#5b6478" stroke-width="1" marker-start="url(#as)" marker-end="url(#a)"/>
<text x="566.75" y="523.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="middle">533 mm lens setback</text>
<text x="60.00" y="578.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">At 533 mm the lens sees the last 0.5 m of shaft, the cue ball and a wide cone of</text>
<text x="60.00" y="593.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">table beyond it. Closer to the tip and the shaft fills the frame; further back and</text>
<text x="60.00" y="608.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">the tip leaves frame on a long follow-through.</text>
<text x="60.00" y="623.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="60.00" y="638.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">The shaft itself eats a wedge 16° wide at the collar, narrowing to 1° at the tip -</text>
<text x="60.00" y="653.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">a tapering spike up the middle of the shot. That spike IS the aiming reference.</text>
<rect x="800.00" y="92.00" width="740.00" height="440.00" rx="8" fill="#0c5c3a" stroke="#141a26" stroke-width="1.2"/>
<text x="800.00" y="82.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">Simulated 1080p frame, barrel distortion of a 150° lens</text>
<rect x="802.00" y="94.00" width="736.00" height="436.00" rx="6" fill="#0a5334" stroke="none" stroke-width="1"/>
<path d="M802,188 Q1170.0,132 1538,188 L1538,94 L802,94 Z" fill="#0d3f6b" stroke="none" stroke-width="1.4"/>
<text x="1170.00" y="126.00" font-size="11" fill="#9fc6ee" font-weight="400" text-anchor="middle">far cushion + pocket</text>
<circle cx="950.00" cy="166.00" r="17.00" fill="#06121f" stroke="#0d3f6b" stroke-width="2"/>
<path d="M1100,532 Q1152,392 1172,297" fill="none" stroke="#11161f" stroke-width="54" stroke-linecap="round"/>
<path d="M1100,532 Q1152,392 1172,297" fill="none" stroke="#2b3444" stroke-width="30" stroke-linecap="round"/>
<circle cx="1174.00" cy="290.00" r="10.00" fill="#e8dcc0" stroke="#11161f" stroke-width="2"/>
<text x="1100.00" y="492.00" font-size="11" fill="#cfe0d6" font-weight="400" text-anchor="middle">own shaft + tip</text>
<circle cx="1174.00" cy="264.00" r="26.00" fill="#fbfbf7" stroke="#2a2a2a" stroke-width="1.4"/>
<circle cx="1166.00" cy="256.00" r="8.00" fill="#ffffff" stroke="none" stroke-width="1" opacity="0.85"/>
<circle cx="1032.00" cy="220.00" r="19.00" fill="#f0c419" stroke="#2a2a2a" stroke-width="1.4"/>
<circle cx="1340.00" cy="232.00" r="19.00" fill="#c0392b" stroke="#2a2a2a" stroke-width="1.4"/>
<line x1="1174.00" y1="264.00" x2="1032.00" y2="220.00" stroke="#3a7bff" stroke-width="3" opacity="0.95"/>
<circle cx="1052.00" cy="227.00" r="26.00" fill="none" stroke="#3a7bff" stroke-width="2.4" stroke-dasharray="6 4"/>
<line x1="1032.00" y1="220.00" x2="950.00" y2="174.00" stroke="#ff3df0" stroke-width="2.6"/>
<circle cx="950.00" cy="166.00" r="20.00" fill="none" stroke="#39ff88" stroke-width="2.6"/>
<text x="816.00" y="516.00" font-size="11" fill="#9ad9b4" font-weight="400" text-anchor="start">overlay rendered by the Pool AR engine in this repo</text>
<rect x="800.00" y="560.00" width="740.00" height="140.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="812.00" y="580.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">Why this viewpoint is worth having</text>
<text x="812.00" y="592.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">A ceiling or tripod camera sees the table but not your stroke. This one sees the</text>
<text x="812.00" y="609.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">cue, the tip, the cue ball and the line - from the only place that shows whether</text>
<text x="812.00" y="626.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">the cue went straight through the ball or steered off it. Frame-to-frame lens</text>
<text x="812.00" y="643.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">motion is also a direct read of stroke yaw, which is the single hardest fault</text>
<text x="812.00" y="660.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">to self-diagnose. The gyro log lands in the same file as the video.</text>
</svg>