<text x="82.00" y="710.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">Print settings that actually matter here</text>
<text x="88.00" y="726.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Dry the nylon - 12 h at 70 °C, and print it out of a dry box. Wet PA6-CF prints look fine and delaminate under shock.   •   Collar barrel: 6 walls, 40% gyroid; the walls carry the bayonet lugs, infill does nothing.</text>
<text x="88.00" y="744.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Never print the joint threads, the weight sleeve or the ferrule - those are metal, bought and bonded.   •   PLA anywhere on this cue will creep under the bolt preload within a month. ABS/ASA is the fallback; PA6-CF is the right answer.</text>
