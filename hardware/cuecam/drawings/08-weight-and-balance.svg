<rect x="1000.00" y="372.00" width="540.00" height="210.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="1012.00" y="392.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">Read this before choosing a weight</text>
<text x="1016.00" y="408.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">A bare carbon-tube cue of this geometry comes out at</text>
<text x="1016.00" y="425.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">11.3 oz. Every cue in this weight class is</text>
<text x="1016.00" y="442.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">carrying ballast somewhere - wooden cues just hide it in</text>
<text x="1016.00" y="459.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">the forearm. Putting all of it under the bumper is what</text>
<text x="1016.00" y="476.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">makes a light cue feel wrong, not the weight itself.</text>
<text x="1016.00" y="493.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start"></text>
<text x="1016.00" y="510.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Mode A is what you will actually use day to day.</text>
<text x="1016.00" y="527.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">Mode B exists for the one comparison that matters:</text>
<text x="1016.00" y="544.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">proving the camera changed nothing.</text>
<rect x="40.00" y="620.00" width="900.00" height="118.00" rx="8" fill="#f7f9fc" stroke="#e6eaf2" stroke-width="1.2"/>
<text x="52.00" y="640.00" font-size="12.5" fill="#141a26" font-weight="700" text-anchor="start">The camera&#x27;s real cost</text>
<text x="58.00" y="656.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">The cartridge station is 470 mm ahead of the balance point, so each gram there</text>
<text x="58.00" y="673.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">needs 1.44 g of butt ballast to stay in balance - 2.44 g of finished cue per gram of camera.</text>
<text x="58.00" y="690.00" font-size="11.5" fill="#5b6478" font-weight="400" text-anchor="start">A 25 g cartridge is 61 g of cue. A 45 g one is 110 g, and 21 oz stops being reachable with any balance you would want.</text>
